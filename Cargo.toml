[package]
name = "open-tangerine"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Open Tangerine for Windows: a radial wheel for the files you are dragging"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Slint draws the wheel. The software renderer is used on purpose: it can be
# pointed at a buffer of our own, which is what lets the wheel be a per-pixel
# transparent Win32 layered window.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "renderer-software",
    "compat-1-2",
] }

# Win32: the overlay window, the clipboard, the pointer and the keys.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Media", "Win32_Media_Audio", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

# Document/archive conversions (Phase B-6): subtitles and archives are
# handled in Rust without FFmpeg.
zip = "0.6"
flate2 = "1.0"
tar = "0.4"

# SVG rasterisation (Phase B-9.3): resvg is vendored through Slint but we
# need it as a direct dependency for SVG→PNG conversion.
resvg = "0.48"
png = "0.18"
usvg = "0.48"
pdfium-render = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
calamine = "0.37.0"
quick-xml = "0.42.0"
pdf-writer = "0.15.0"

# The stand-in for the conversion program, used by the tests.
#
# It is a program of its own, because the tests have to start a real child
# process, and Windows will not run a batch file without a shell. The
# feature keeps it out of an ordinary build, so it is never shipped.
[features]
test-helper = []

[[bin]]
name = "ot-fake-ffmpeg"
path = "tests/support/fake_ffmpeg.rs"
required-features = ["test-helper"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
slint-build = "1.18"
